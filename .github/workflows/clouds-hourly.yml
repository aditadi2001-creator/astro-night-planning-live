name: Hourly satellite clouds (GMGSI to R2)

# Every hour: take the newest NOAA GMGSI infrared mosaic(s) not yet published,
# turn each hour into ONE PMTiles file (~4 MB) and publish it to R2 with the
# storage guard in pipelines/r2/r2.py. Hours older than 24 h are deleted in
# the same run (deletes are free); an R2 lifecycle rule also deletes
# clouds/hourly/ after 2 days as a backup.
#
# R2 cost per hour with something new: 1 list + 1-3 uploads + 1 small JSON
# = 3-5 Class A operations (~2,200/month of the free 1,000,000).
# When nothing is new the job stops before touching R2 at all.
on:
  schedule:
    - cron: '47 * * * *' # GMGSI files appear ~40 min after the hour
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clouds-hourly
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipelines/clouds/requirements.txt
      - run: pip install -r pipelines/clouds/requirements.txt
      - name: Build new hours (raw NetCDF stays on the runner)
        working-directory: pipelines/clouds
        run: |
          base=$(grep -E '^VITE_DATA_BASE=' ../../.env.production | cut -d= -f2-)
          python gmgsi.py run --out out --have-url "$base/data/clouds-latest.json" \
            --max-new 3 --keep-hours 24
          ls -la out/*.pmtiles 2>/dev/null || echo "no new hours"
      - name: Publish to R2 (guarded)
        if: hashFiles('pipelines/clouds/out/*.pmtiles') != ''
        working-directory: pipelines/r2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python r2.py publish-hourly ../clouds/out --keep-hours 24
      # Satellite orbits for the pass predictions ride along with this reliable hourly
      # run instead of a cron of their own. CelesTrak blocks clients that download the
      # same data more than once every two hours, so browsers never call it: this step
      # fetches at most every 6 h and publishes data/orbits.json (~50 kB, 2 Class A ops).
      - name: Fetch satellite orbits (at most every 6 h)
        id: orbits
        continue-on-error: true
        working-directory: pipelines/orbits
        run: |
          base=$(grep -E '^VITE_DATA_BASE=' ../../.env.production | cut -d= -f2-)
          python orbits.py run --out out/orbits.json --have-url "$base/data/orbits.json"
      - name: Publish orbits to R2 (guarded)
        if: steps.orbits.outcome == 'success' && hashFiles('pipelines/orbits/out/orbits.json') != ''
        working-directory: pipelines/r2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: >-
          python r2.py upload ../orbits/out/orbits.json data/orbits.json
          --type application/json --cache "public, max-age=300"
