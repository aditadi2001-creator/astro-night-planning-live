name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type check
        run: npm run check
      - name: Lint
        run: npm run lint
      - name: Formatting
        run: npm run format:check
      - name: Unit tests (physics formulas)
        run: npm test
      - name: Build
        run: npm run build
      - name: Worker type check
        run: npx tsc -p worker
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Pipeline unit tests (eph tile format)
        working-directory: pipelines/catalogs
        run: pip install numpy && python -m unittest test_eph -v
      - name: R2 storage-guard tests
        working-directory: pipelines/r2
        run: pip install boto3 && python -m unittest test_r2 -v
