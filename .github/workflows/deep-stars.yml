name: Deep star layer to R2

# Gaia DR3 from GAVO, one magnitude band per job (each well under the 6-hour job
# limit; GAVO answers a band in ~20-40 min), then one job builds the PMTiles
# archive from all bands and uploads it as stars/gaia-deep-<version>.pmtiles.
on:
  workflow_dispatch:
    inputs:
      vmax:
        description: Faintest magnitude (G for the download, V for the layer); 16 = ~0.9 GB
        default: '16.0'
      version:
        description: Key version (stars/gaia-deep-<version>.pmtiles); a new one per rebuild
        default: 'v2'

permissions:
  contents: read

concurrency:
  group: r2-writes
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      bands: ${{ steps.p.outputs.bands }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install requests
      - id: p
        working-directory: pipelines/catalogs
        env:
          VMAX: ${{ inputs.vmax }}
        run: echo "bands=$(python fetch.py --list-deep-bands --deep-gmax "$VMAX")" >> "$GITHUB_OUTPUT"

  fetch:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 3 # gentle on GAVO
      matrix:
        band: ${{ fromJSON(needs.plan.outputs.bands) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install requests numpy astropy
      - name: Fetch one band (GAVO async TAP)
        working-directory: pipelines/catalogs
        env:
          VMAX: ${{ inputs.vmax }}
        run: python fetch.py --only gaia-deep --deep-gmax "$VMAX" --deep-band ${{ matrix.band }}
      - uses: actions/upload-artifact@v5
        with:
          name: gaia-band-${{ matrix.band }}
          path: pipelines/catalogs/raw/gaia_deep_*.fits
          retention-days: 3
          compression-level: 0

  build-upload:
    needs: fetch
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install
        run: pip install numpy astropy astropy-healpix pmtiles requests boto3
      - uses: actions/download-artifact@v5
        with:
          pattern: gaia-band-*
          merge-multiple: true
          path: pipelines/catalogs/raw
      - name: Build PMTiles
        working-directory: pipelines/catalogs
        env:
          VMAX: ${{ inputs.vmax }}
          VERSION: ${{ inputs.version }}
        run: python build_gaia_deep.py --vmax "$VMAX" --out "out/gaia-deep-$VERSION.pmtiles"
      - name: Upload to R2 (guarded)
        working-directory: pipelines/r2
        env:
          VERSION: ${{ inputs.version }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          python r2.py usage
          python r2.py upload "../catalogs/out/gaia-deep-$VERSION.pmtiles" "stars/gaia-deep-$VERSION.pmtiles" \
            --type application/vnd.pmtiles --cache "public, max-age=31536000, immutable"
          python r2.py upload "../catalogs/out/gaia-deep-$VERSION.properties" "stars/gaia-deep-$VERSION.properties" \
            --type "text/plain; charset=utf-8" --cache "public, max-age=86400"
          python r2.py usage
