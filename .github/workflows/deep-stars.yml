name: Deep star layer to R2

# Builds the Gaia DR3 V 10–14 layer as ONE PMTiles file and uploads it to R2
# through pipelines/r2/r2.py (8 GB hard guard). Manual only: it runs once, or
# when the catalog method changes. Raw downloads never leave the runner.
on:
  workflow_dispatch:
    inputs:
      vmax:
        description: Faintest magnitude (G for the download, V for the layer); 16 = ~0.9 GB
        default: '16.0'
      version:
        description: Key version (stars/gaia-deep-<version>.pmtiles); a new one per rebuild
        default: 'v2'

permissions:
  contents: read

concurrency:
  group: r2-writes
  cancel-in-progress: false

jobs:
  build-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install
        run: pip install numpy astropy astropy-healpix pmtiles requests boto3
      - name: Fetch Gaia DR3 down to vmax (GAVO async TAP, stays on the runner)
        working-directory: pipelines/catalogs
        run: python fetch.py --only gaia-deep --deep-gmax "${{ inputs.vmax }}"
      - name: Build PMTiles
        working-directory: pipelines/catalogs
        run: >-
          python build_gaia_deep.py --vmax "${{ inputs.vmax }}"
          --out "out/gaia-deep-${{ inputs.version }}.pmtiles"
      - name: Upload to R2 (guarded)
        working-directory: pipelines/r2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          python r2.py usage
          python r2.py upload ../catalogs/out/gaia-deep-${{ inputs.version }}.pmtiles stars/gaia-deep-${{ inputs.version }}.pmtiles \
            --type application/vnd.pmtiles --cache "public, max-age=31536000, immutable"
          python r2.py upload ../catalogs/out/gaia-deep-${{ inputs.version }}.properties stars/gaia-deep-${{ inputs.version }}.properties \
            --type "text/plain; charset=utf-8" --cache "public, max-age=86400"
          python r2.py usage
