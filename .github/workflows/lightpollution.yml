name: Yearly light pollution (Black Marble to R2)

# Once a year: NASA Black Marble VNP46A4 night lights -> sky-glow model
# calibrated on Globe at Night SQM readings -> two PMTiles files in R2.
# The site switches to the new year only after the new tiles pass checks
# through the Worker; the previous year is deleted after that switch.
#
# Needs the EARTHDATA_TOKEN secret (expires after ~60 days). If it is missing
# or expired the job stops early and the site keeps its current map.
# See README "Yearly light pollution update — 2 minutes".
on:
  schedule:
    - cron: '23 4 20 5 *' # 20 May; NASA publishes the previous year in spring
  workflow_dispatch:
    inputs:
      year:
        description: Year (empty = newest available)
        default: ''
      tiles:
        description: Only these tiles for a quick test, e.g. h17v03,h18v03 (nothing is uploaded)
        default: ''
      upload:
        description: Upload to R2 and switch the site
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: lightpollution
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    defaults:
      run:
        working-directory: pipelines/lightpollution
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipelines/lightpollution/requirements.txt
      - run: pip install -r requirements.txt

      - name: Pick the year
        id: pick
        run: |
          base=$(grep -E '^VITE_DATA_BASE=' ../../.env.production | cut -d= -f2-)
          echo "base=$base" >> "$GITHUB_OUTPUT"
          year="${{ inputs.year }}"
          [ -n "$year" ] || year=$(python -c "import fetch; print(fetch.latest_year())")
          published=$(curl -fsS "$base/data/lightpollution.json" | python -c "import sys,json; print(json.load(sys.stdin)['year'])" 2>/dev/null || echo none)
          echo "year=$year" >> "$GITHUB_OUTPUT"
          echo "newest $year, published $published"
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$year" = "$published" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"; echo "Already up to date."
          fi

      - name: Cache extracted night lights
        if: steps.pick.outputs.skip != 'true'
        uses: actions/cache@v6
        with:
          path: pipelines/lightpollution/raw
          key: blackmarble-${{ steps.pick.outputs.year }}-${{ inputs.tiles || 'all' }}-v1

      - name: Download night lights (raw HDF5 never leaves the runner)
        if: steps.pick.outputs.skip != 'true'
        env:
          EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
        run: python fetch.py --year ${{ steps.pick.outputs.year }} --tiles "${{ inputs.tiles }}" --workers 6

      - name: Calibrate, model and tile
        if: steps.pick.outputs.skip != 'true'
        run: python skyglow.py all --year ${{ steps.pick.outputs.year }}

      - uses: actions/upload-artifact@v5
        if: steps.pick.outputs.skip != 'true'
        with:
          name: lightpollution-${{ steps.pick.outputs.year }}-report
          path: |
            pipelines/lightpollution/out/calibration.json
            pipelines/lightpollution/out/lightpollution.json

      - name: Upload tiles to R2 (guarded)
        if: steps.pick.outputs.skip != 'true' && inputs.tiles == '' && (github.event_name == 'schedule' || inputs.upload)
        working-directory: pipelines/r2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          y=${{ steps.pick.outputs.year }}
          python r2.py usage
          python r2.py upload ../lightpollution/out/lp-$y.pmtiles lightpollution/lp-$y.pmtiles \
            --type application/vnd.pmtiles --cache "public, max-age=31536000, immutable"
          python r2.py upload ../lightpollution/out/lprad-$y.pmtiles lightpollution/lprad-$y.pmtiles \
            --type application/vnd.pmtiles --cache "public, max-age=31536000, immutable"

      - name: Check the new tiles through the Worker
        if: steps.pick.outputs.skip != 'true' && inputs.tiles == '' && (github.event_name == 'schedule' || inputs.upload)
        run: python verify.py --year ${{ steps.pick.outputs.year }} --base "${{ steps.pick.outputs.base }}"

      - name: Switch the site to the new year, then delete the previous one
        if: steps.pick.outputs.skip != 'true' && inputs.tiles == '' && (github.event_name == 'schedule' || inputs.upload)
        working-directory: pipelines/r2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          y=${{ steps.pick.outputs.year }}
          python r2.py upload ../lightpollution/out/lightpollution.json data/lightpollution.json \
            --type application/json --cache "public, max-age=3600"
          python r2.py keep-lp-year $y
          python r2.py usage
