name: Keep scheduled jobs alive

# GitHub pauses scheduled workflows in public repositories after 60 days
# without repository activity. Once a month this job commits the date to
# status/keepalive.md, which counts as activity, so the hourly cloud job keeps
# running even when nobody pushes code.
#
# If a scheduled workflow was paused anyway: repo -> Actions -> pick the
# workflow on the left -> "Enable workflow".
on:
  schedule:
    - cron: '17 3 1 * *' # 03:17 UTC on the 1st of every month
  workflow_dispatch:

permissions:
  contents: write

jobs:
  touch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Record the date
        run: |
          mkdir -p status
          {
            echo '# Keep-alive'
            echo
            echo 'Updated monthly by .github/workflows/keepalive.yml so GitHub does not pause'
            echo 'the scheduled jobs (it does after 60 days without activity).'
            echo
            echo "Last run: $(date -u +%Y-%m-%dT%H:%MZ)"
          } > status/keepalive.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add status/keepalive.md
          git commit -m 'chore: monthly keep-alive for scheduled workflows' || exit 0
          git push
